<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>浇注方向示意图 v8 预览（未接入产品）</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei"; max-width: 720px; margin: 20px auto; background: #f1f5f9; }
  .note { font-size: 13px; color: #334155; line-height: 1.9; background: #fff; border-left: 3px solid #2563eb; padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 16px 14px; margin: 14px 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  svg { width: 100%; display: block; }
</style>
</head>
<body>
<h1 style="font-size:18px;margin:0 0 4px">浇注方向示意图 v8（预览审核版）</h1>
<div class="note">
  本轮改动（v7 基础上 3 点，<b>未接入产品</b>）：<br>
  1. 删除"直浇道""横浇道"两个文字标识（形状本身已清楚）；<br>
  2. 浇口杯与直浇道<b>中心对齐</b>，浇口杯底宽 = 直浇道顶宽，成连续收窄的一体流道；<br>
  3. Ho 尺寸线整体<b>左移贴近直浇道</b>。
</div>

<div class="card">
  <h2>顶注（内浇口在铸件顶内侧）</h2>
  <div id="svg_顶注"></div>
</div>
<div class="card">
  <h2>中注（内浇口在铸件中部）</h2>
  <div id="svg_中注"></div>
</div>
<div class="card">
  <h2>底注（内浇口在铸件底部）</h2>
  <div id="svg_底注"></div>
</div>

<script>
function dimV(x, y1, y2, label, textX, textY, markerId) {
  return `
  <line x1="${x - 4}" y1="${y1}" x2="${x + 4}" y2="${y1}" stroke="#64748b" stroke-width="0.9"/>
  <line x1="${x - 4}" y1="${y2}" x2="${x + 4}" y2="${y2}" stroke="#64748b" stroke-width="0.9"/>
  <line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#0f172a" stroke-width="1"
        marker-start="url(#${markerId})" marker-end="url(#${markerId})"/>
  <text x="${textX}" y="${textY}" font-size="10" fill="#0f172a" font-weight="600" dominant-baseline="middle" text-anchor="end">${label}</text>`;
}

// 浇注方向 → 内浇口中心层 gy（入口深度）
const GY = { '顶注': 102, '中注': 150, '底注': 196 };

function svg(pos) {
  const gy = GY[pos];
  const mid = 'arr_' + pos;
  const gateLblY = pos === '顶注' ? gy + 12 : gy - 12;   // 内浇口标签：顶注放条下，其余放条上
  return `<svg viewBox="0 0 340 265" width="100%" xmlns="http://www.w3.org/2000/svg" style="background:#fafafa;border:1px solid #e2e8f0;border-radius:8px">
  <defs>
    <marker id="${mid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <style>.cap{font-size:9px;fill:#475569;paint-order:stroke;stroke:#ffffff;stroke-width:2.5}</style>

  <!-- 浇注方向 -->
  <line x1="255" y1="2" x2="255" y2="6" stroke="#dc2626" stroke-width="1.6" marker-end="url(#${mid})"/>

  <!-- 浇口杯：倒梯形，底宽 = 直浇道顶宽，中心对齐成连续收窄 -->
  <polygon points="236,7 274,7 264,24 246,24" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.1"/>
  <text x="232" y="15" class="cap" text-anchor="end">浇口杯</text>

  <!-- 直浇道：垂直梯形上宽下窄，穿过横浇道后下延一段（与浇口杯同中心） -->
  <polygon points="246,24 264,24 260,${gy + 8} 250,${gy + 8}" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.1"/>

  <!-- 横浇道：扁长横条（浅蓝），从直浇道底部向左延伸 -->
  <rect x="235" y="${gy - 4}" width="23" height="8" fill="#a5d8ff" stroke="#1c7ed6" stroke-width="1"/>

  <!-- 内浇口：横浇道前端同轴延伸，薄一半（深蓝），伸入铸件 -->
  <rect x="215" y="${gy - 2}" width="20" height="4" fill="#1971c2"/>
  <text x="207" y="${gateLblY}" class="cap">内浇口</text>

  <!-- 砂箱 -->
  <rect x="15" y="25" width="322" height="195" fill="none" stroke="#0f172a" stroke-width="2.2"/>
  <text x="300" y="19" class="cap">上箱面</text>
  <text x="300" y="230" class="cap">下箱面</text>

  <!-- 冒口 -->
  <rect x="155" y="35" width="60" height="60" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="185" y="68" font-size="10" fill="#7a4b06" text-anchor="middle" font-weight="600">冒口</text>

  <!-- 铸件 -->
  <rect x="135" y="95" width="100" height="105" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/>
  <text x="185" y="150" font-size="10" fill="#334155" text-anchor="middle" font-weight="600">铸件</text>

  <!-- Ho：内浇口中心层 → 上箱面（贴近直浇道右侧） -->
  ${dimV(292, gy, 25, 'Ho', 286, (gy + 25) / 2, mid)}

  <!-- rh / ph -->
  ${dimV(144, 35, 95, 'rh', 138, 65, mid)}
  ${dimV(118, 95, 200, 'ph', 112, 147, mid)}

  <!-- 底部注释 -->
  <text x="18" y="238" font-size="9" fill="#64748b">Ho — 内浇道基准到上箱面的垂直距离</text>
  <text x="18" y="250" font-size="9" fill="#64748b">ph — 铸件浇注方向高度（铸件底 → 铸件顶）</text>
  <text x="18" y="262" font-size="9" fill="#64748b">rh — 冒口高出铸件顶面的距离（铸件顶 → 冒口顶）</text>
</svg>`;
}

for (const p of ['顶注', '中注', '底注']) {
  document.getElementById('svg_' + p).innerHTML = svg(p);
}
</script>
</body>
</html>
